name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc clang make
      - name: Build
        run: make clean && make CC=${{ matrix.compiler }}
      - name: Unit tests
        run: make CC=${{ matrix.compiler }} test-unit
      - name: CLI smoke tests
        run: make CC=${{ matrix.compiler }} test-smoke

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc make
      - name: Address and undefined behavior sanitizers
        run: make test-sanitize
